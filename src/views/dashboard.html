<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Memory Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="//unpkg.com/three"></script>
    <script src="//unpkg.com/3d-force-graph"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans KR"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                },
            },
        }
    </script>
</head>
    <body class="bg-gray-100 h-screen flex flex-col overflow-hidden">
    <!-- Header -->
    <header class="bg-white shadow-sm p-4 z-10">
        <div class="max-w-7xl mx-auto flex justify-between items-center gap-4">
            <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2 whitespace-nowrap">
                🧠 RAG Memory Viewer ({{DIR_NAME}})
            </h1>

            <!-- Agent Galaxy Button -->
            <button id="toggle-graph"
                    class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-md font-medium transition-colors flex items-center gap-2"
                    onclick="toggleGraph()">
                🌌 Agent Galaxy
            </button>

            <!-- Search functionality -->
            <div class="flex-1 max-w-xl">
                 <input type="text"
                        id="search-input"
                        placeholder="Search content, agent, or path..."
                        class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50"
                        oninput="filterMemories(this.value)">
            </div>

            <div class="text-sm text-gray-500 whitespace-nowrap" id="total-count">Loading...</div>
        </div>
    </header>

    <!-- Graph Container -->
    <div id="graph-container" class="hidden bg-slate-900 border-b-2 border-slate-700">
        <div id="3d-graph" class="w-full h-[400px]"></div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 overflow-hidden bg-gray-50">
        <main class="h-full w-full p-6 overflow-y-auto">
            <div id="memory-list" class="space-y-4 max-w-5xl mx-auto">
                <div class="text-center text-gray-400 mt-20">
                    Loading memories...
                </div>
            </div>

            <!-- Load More Button -->
            <div id="load-more-container" class="flex justify-center mt-8 mb-8 hidden">
                <button id="load-more-btn"
                        onclick="loadMemories(false)"
                        class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-md font-medium transition-colors flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                    Load More
                </button>
            </div>
        </main>
    </div>

    <script>
        // State management
        let allMemories = [];          // All memories (for search filtering)
        let displayedMemories = [];     // Currently displayed memories
        let graphInstance = null;
        let graphVisible = false;

        // Pagination state
        let currentOffset = 0;
        const PAGE_SIZE = 20;
        let isLoading = false;
        let hasMore = true;
        let totalCount = 0;

        // Toggle graph visibility
        function toggleGraph() {
            const container = document.getElementById('graph-container');
            const button = document.getElementById('toggle-graph');
            graphVisible = !graphVisible;

            if (graphVisible) {
                container.classList.remove('hidden');
                button.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
                button.classList.add('bg-slate-700', 'hover:bg-slate-800');
                if (!graphInstance) {
                    renderGraph();
                } else {
                    graphInstance.resumeAnimation();
                }
            } else {
                container.classList.add('hidden');
                button.classList.add('bg-indigo-600', 'hover:bg-indigo-700');
                button.classList.remove('bg-slate-700', 'hover:bg-slate-800');
                if (graphInstance) {
                    graphInstance.pauseAnimation();
                }
            }
        }

        // Color hash function - generates consistent color from agent name
        function stringToColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash; // Convert to 32bit integer
            }
            const hue = Math.abs(hash % 360);
            return 'hsl(' + hue + ', 70%, 60%)';
        }

        // Render graph
        function renderGraph() {
            const elem = document.getElementById('3d-graph');
            if (!elem) return;

            if (allMemories.length === 0) {
                // Remove existing graph instance
                if (graphInstance) {
                    graphInstance._destructor();
                    graphInstance = null;
                }
                // Show empty state message
                elem.innerHTML =
                    '<div class="flex items-center justify-center h-full">' +
                    '    <div class="text-center">' +
                    '        <div class="text-6xl mb-4">🌌</div>' +
                    '        <p class="text-gray-300 text-lg font-medium">No memory data available to visualize yet.</p>' +
                    '        <p class="text-gray-500 text-sm mt-2">Add memories to see the Agent Galaxy graph.</p>' +
                    '    </div>' +
                    '</div>';
                return;
            }

            // Aggregate memory count by agent
            const agentCounts = new Map();
            const agents = new Set();
            const agentGroups = new Map(); // Group agents by name prefix for color grouping

            allMemories.forEach(m => {
                if (m.agent) {
                    const count = agentCounts.get(m.agent) || 0;
                    agentCounts.set(m.agent, count + 1);
                    agents.add(m.agent);

                    // Create group based on agent name (first character or type)
                    const group = m.agent.charAt(0).toLowerCase();
                    if (!agentGroups.has(m.agent)) {
                        agentGroups.set(m.agent, group);
                    }
                }
            });

            // Create nodes with enhanced data
            const nodes = Array.from(agents).map(agent => ({
                id: agent,
                val: agentCounts.get(agent) || 1,
                group: agentGroups.get(agent) || 'default',
                color: stringToColor(agent)
            }));

            // Create links with weight aggregation
            const linkMap = new Map(); // Key: "source-target", Value: count
            const agentRegex = /@(\w+)/g;

            allMemories.forEach(m => {
                const sourceAgent = m.agent;
                if (!sourceAgent) return;

                const content = m.content || '';
                let match;
                const mentionedAgents = new Set();

                // Extract all @agent mentions
                while ((match = agentRegex.exec(content)) !== null) {
                    const targetAgent = match[1];
                    mentionedAgents.add(targetAgent);
                }

                // Create or increment link weight for each mentioned agent
                mentionedAgents.forEach(targetAgent => {
                    if (targetAgent !== sourceAgent && agents.has(targetAgent)) {
                        const linkKey = [sourceAgent, targetAgent].sort().join('->');
                        const currentWeight = linkMap.get(linkKey) || 0;
                        linkMap.set(linkKey, {
                            source: sourceAgent,
                            target: targetAgent,
                            weight: currentWeight + 1
                        });
                    }
                });
            });

            // Convert link map to array
            const links = Array.from(linkMap.values());

            // Initialize graph - remove empty state message
            elem.innerHTML = '';

            // Calculate max weight for link width normalization
            const maxWeight = links.length > 0 ? Math.max(...links.map(l => l.weight)) : 1;

            graphInstance = ForceGraph3D()(elem)
                .graphData({ nodes, links })

                // Cosmic Node Styling
                .nodeLabel('id')
                .nodeAutoColorBy('group')
                .nodeVal('val')
                .nodeRelSize(8) // Larger nodes
                .nodeResolution(16) // Smooth sphere rendering
                .nodeOpacity(0.9)
                .nodeThreeObject(node => {
                    const obj = new THREE.Mesh(
                        new THREE.SphereGeometry(1, 16, 16),
                        new THREE.MeshBasicMaterial({ color: node.color })
                    );
                    return obj;
                })

                // Cosmic Link Styling
                .linkWidth(link => Math.max(0.5, (link.weight / maxWeight) * 3)) // Width based on weight
                .linkColor(() => 'rgba(100, 149, 237, 0.4)') // Soft blue/cornflower with transparency
                .linkDirectionalArrowLength(3.5)
                .linkDirectionalArrowRelPos(1)
                .linkDirectionalArrowColor(() => 'rgba(100, 149, 237, 0.6)')
                .linkOpacity(0.4)

                // Background & Atmosphere
                .backgroundColor('#0f172a')
                .showNavInfo(false) // Clean look without nav info

                // Camera Controls
                .cameraPosition({ x: 0, y: 100, z: 200 }) // Initial camera position
                .onEngineStop(() => {
                    // Auto-rotate when simulation stabilizes
                    graphInstance
                        .cameraPosition({ x: 0, y: 0, z: 200 }, 1000)
                        .zoomToFit(200);
                })

                // Interactions
                .onNodeClick((node) => {
                    // Filter memories by agent when node is clicked
                    filterMemories('@' + node.id);
                })
                .onBackgroundClick(() => {
                    // Clear filter when background is clicked
                    filterMemories('');
                })
                .onNodeHover(node => {
                    elem.style.cursor = node ? 'pointer' : 'default';
                })
                .onLinkHover(link => {
                    elem.style.cursor = link ? 'pointer' : 'default';
                });

            // Smooth camera animation on load
            setTimeout(() => {
                if (graphInstance) {
                    // Gentle rotation animation
                    let angle = 0;
                    const animate = () => {
                        angle += 0.003; // Slow rotation
                        if (graphInstance) {
                            graphInstance.cameraPosition({
                                x: Math.sin(angle) * 200,
                                y: 50,
                                z: Math.cos(angle) * 200
                            });
                            requestAnimationFrame(animate);
                        }
                    };
                    animate();
                }
            }, 1000);
        }

        // Initial memory load
        async function loadMemories(reset = true) {
            console.log('[loadMemories] Called with reset:', reset, 'currentOffset:', currentOffset);

            if (reset) {
                currentOffset = 0;
                displayedMemories = [];
                hasMore = true;
            }

            // Abort if loading or no more items to load
            if (isLoading || !hasMore) {
                console.log('[loadMemories] Skipping - isLoading:', isLoading, 'hasMore:', hasMore);
                return;
            }

            isLoading = true;
            updateLoadMoreButton();

            try {
                // Search mode if query exists, otherwise load all
                const searchInput = document.getElementById('search-input');
                const query = searchInput ? searchInput.value.trim() : '';

                const url = query
                    ? `/api/memories?limit=${PAGE_SIZE}&offset=${currentOffset}`
                    : `/api/memories?limit=${PAGE_SIZE}&offset=${currentOffset}`;

                const res = await fetch(url);

                if (!res.ok) {
                    throw new Error(`HTTP error! status: ${res.status}`);
                }

                const data = await res.json();

                // Process response data (compatibility consideration)
                const items = data.items || (Array.isArray(data) ? data : []);
                const total = data.total !== undefined ? data.total : items.length;
                hasMore = data.hasMore !== undefined ? data.hasMore : (items.length === PAGE_SIZE);
                totalCount = total;

                // Add to memory array
                if (reset) {
                    displayedMemories = items;
                } else {
                    displayedMemories = displayedMemories.concat(items);
                }

                // Update allMemories only when not in search mode
                if (!query) {
                    allMemories = displayedMemories;
                }

                // Update offset
                currentOffset += items.length;

                // Update UI
                // Render only newly received items in append mode if reset is false
                if (reset) {
                    renderMemories(displayedMemories, false);
                } else {
                    renderMemories(items, true);
                }
                updateTotalCount();
                updateLoadMoreButton();

                // Render graph (only when not in search mode)
                if (!query && reset) {
                    renderGraph();
                }

            } catch (e) {
                console.error('Failed to load data:', e);
                showError('Failed to load data: ' + (e.message || 'Unknown error'));
                hasMore = false;
            } finally {
                isLoading = false;
                updateLoadMoreButton();
            }
        }

        // Update Load More button
        function updateLoadMoreButton() {
            const button = document.getElementById('load-more-btn');
            if (!button) return;

            if (isLoading) {
                button.disabled = true;
                button.innerHTML = '<span class="inline-block animate-spin mr-2">⏳</span> Loading...';
                button.classList.add('opacity-50', 'cursor-not-allowed');
            } else if (!hasMore || displayedMemories.length >= totalCount) {
                button.disabled = true;
                button.innerHTML = 'All items loaded';
                button.classList.add('opacity-50', 'cursor-not-allowed');
                button.style.display = 'none'; // Hide button when all items are loaded
            } else {
                button.disabled = false;
                const remaining = totalCount - displayedMemories.length;
                button.innerHTML = `Load More (${remaining} remaining)`;
                button.classList.remove('opacity-50', 'cursor-not-allowed');
                button.style.display = 'block';
            }
        }

        // Update total count display
        function updateTotalCount() {
            const totalCountEl = document.getElementById('total-count');
            if (totalCountEl) {
                if (totalCount > 0) {
                    totalCountEl.innerText = `Showing ${displayedMemories.length} of ${totalCount} items`;
                } else {
                    totalCountEl.innerText = 'No memories found';
                }
            }
        }

        // Show error message
        function showError(message) {
            const container = document.getElementById('memory-list');
            const errorHtml = `
                <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-4">
                    <p>${message}</p>
                    <button onclick="this.parentElement.remove()" class="mt-2 text-red-600 hover:text-red-800 text-sm">Close</button>
                </div>
            `;
            container.insertAdjacentHTML('afterbegin', errorHtml);
        }

        // Search filtering
        function filterMemories(query) {
            if (!query) {
                // Reset and reload if search query is empty
                loadMemories(true);
                return;
            }

            // Check if query is in @agentName format
            const agentMatch = query.match(/^@(\w+)$/);
            let lowerQuery = query.toLowerCase();

            const filtered = displayedMemories.filter(m => {
                if (agentMatch) {
                    // Exact agent name match if @agentName format
                    return m.agent === agentMatch[1];
                }

                const contentMatch = (m.content || '').toLowerCase().includes(lowerQuery);
                const agentNameMatch = (m.agent || '').toLowerCase().includes(lowerQuery);
                const pathMatch = (m.path || '').toLowerCase().includes(lowerQuery);
                return contentMatch || agentNameMatch || pathMatch;
            });

            // Hide Load More button if search results exist
            displayedMemories = filtered;
            renderMemories(filtered, false);

            const loadMoreBtn = document.getElementById('load-more-btn');
            if (loadMoreBtn) {
                loadMoreBtn.style.display = 'none';
            }

            // Update total count
            const totalCountEl = document.getElementById('total-count');
            if (totalCountEl) {
                totalCountEl.innerText = 'Search Results: ' + filtered.length;
            }
        }

        // Render memory list (supports append mode)
        function renderMemories(list, append = false) {
            const container = document.getElementById('memory-list');
            const loadMoreContainer = document.getElementById('load-more-container');

            if (!append) {
                // Clear existing content
                container.innerHTML = '';
            }

            if (list.length === 0) {
                if (!append) {
                    container.innerHTML = '<div class="text-center text-gray-400 py-10">No search results found.</div>';
                }
                // Hide Load More button
                if (loadMoreContainer) {
                    loadMoreContainer.classList.add('hidden');
                }
                return;
            }

            // Show Load More button
            if (loadMoreContainer) {
                loadMoreContainer.classList.remove('hidden');
            }

            // Full render if list is empty or not in append mode
            if (container.innerHTML === '' || !append) {
                container.innerHTML = list.map(m => createMemoryCard(m)).join('');
            } else {
                // Append mode: iterate through all items in the provided list and add them
                list.forEach(m => {
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = createMemoryCard(m);
                    const cardElement = tempDiv.querySelector('div');
                    if (cardElement) {
                        container.appendChild(cardElement);
                    } else {
                        console.error('[renderMemories] Failed to create card element for:', m.id);
                    }
                });
            }
        }

        // Generate memory card HTML
        function createMemoryCard(m) {
            return `<div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200 hover:shadow-md transition-shadow">
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex items-center gap-2">
                            <span class="px-2 py-1 bg-blue-100 text-blue-800 text-xs font-semibold rounded-full">${m.agent}</span>
                            <span class="text-xs text-gray-500">${m.formattedDate || ''}</span>
                        </div>
                        <button class="text-gray-400 hover:text-gray-600" title="${m.id}">🆔</button>
                    </div>
                    <div class="prose prose-sm max-w-none text-gray-800">${m.contentHtml || m.content}</div>
                    <div class="mt-3 pt-3 border-t border-gray-100 text-xs text-gray-400 font-mono truncate">📍 ${m.path}</div>
                </div>`;
        }

        // Load initial memories on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadMemories(true);
        });
    </script>
</body>
</html>
